name: CI/CD Pipeline

on:
  push:
    branches: [ main, 2025-10-19, develop ]
  pull_request:
    branches: [ main, 2025-10-19 ]
  workflow_dispatch:

jobs:
  # Job 1: Code Quality Checks
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy
      
      - name: Run Black (code formatter check)
        run: black --check --diff .
        continue-on-error: true
      
      - name: Run Flake8 (style checker)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
      
      - name: Run MyPy (type checker)
        run: mypy --ignore-missing-imports config.py nodes.py pipeline.py
        continue-on-error: true

  # Job 2: Unit Tests
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run pytest
        env:
          PIPELINE_TEST: 1
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
        run: |
          pytest tests/ -v --tb=short --maxfail=5
        continue-on-error: true
      
      - name: Run specific integration tests
        env:
          PIPELINE_TEST: 1
        run: |
          python test_n4_gnn_integration.py
        continue-on-error: true

  # Job 3: Data Validation
  data-validation:
    name: Data Quality Checks
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest
      
      - name: Validate data schemas
        run: |
          python -c "
          import pandas as pd
          import numpy as np
          from pathlib import Path
          
          # Check if processed data exists
          proc_dir = Path('data/processed')
          if proc_dir.exists():
              print('✓ Data directory found')
              csv_files = list(proc_dir.glob('*.csv'))
              pkl_files = list(proc_dir.glob('*.pkl'))
              print(f'✓ Found {len(csv_files)} CSV files, {len(pkl_files)} PKL files')
          else:
              print('⚠ No processed data found (expected for CI)')
          "
        continue-on-error: true

  # Job 4: Docker Build Test
  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: matform-ppo:test
          target: development
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm matform-ppo:test python -c "
          import sys
          print(f'Python version: {sys.version}')
          import torch
          import pandas
          import numpy
          print('✓ All core dependencies available')
          "

  # Job 5: Build Summary
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint, test, data-validation, docker]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Data Validation: ${{ needs.data-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker Build: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workflow completed at $(date)" >> $GITHUB_STEP_SUMMARY
