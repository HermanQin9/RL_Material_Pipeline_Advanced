# Kubernetes 部署清单
# MatFormPPO ML Pipeline Kubernetes Deployment Manifests

apiVersion: v1
kind: Namespace
metadata:
  name: matformppo
  labels:
    name: matformppo
    environment: production
---
# ConfigMap - 应用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: matformppo-config
  namespace: matformppo
data:
  # 数据集配置
  PIPELINE_TEST: "0"
  BATCH_SIZE: "100"
  N_TOTAL: "4000"
  TARGET_PROP: "formation_energy_per_atom"
  
  # 训练配置
  PPO_EPISODES: "100"
  PPO_LEARNING_RATE: "0.0003"
  PPO_GAMMA: "0.99"
  
  # 日志配置
  LOG_LEVEL: "INFO"
  DEBUG: "0"
---
# Secret - 敏感信息（需手动创建或使用 Sealed Secrets）
apiVersion: v1
kind: Secret
metadata:
  name: matformppo-secrets
  namespace: matformppo
type: Opaque
stringData:
  # Materials Project API Key（需替换为实际的API密钥）
  MP_API_KEY: "your_materials_project_api_key_here"
  
  # 数据库连接字符串（用于未来的 PostgreSQL 集成）
  DATABASE_URL: "postgresql://user:password@postgres-service:5432/matformppo"
  
  # AWS 凭证（用于 S3 数据存储）
  AWS_ACCESS_KEY_ID: "your_aws_access_key"
  AWS_SECRET_ACCESS_KEY: "your_aws_secret_key"
  AWS_DEFAULT_REGION: "us-east-1"
---
# PersistentVolumeClaim - 数据持久化存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matformppo-data-pvc
  namespace: matformppo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi  # 数据集和缓存存储
  storageClassName: standard
---
# PersistentVolumeClaim - 模型存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matformppo-models-pvc
  namespace: matformppo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi  # 训练模型和检查点存储
  storageClassName: standard
---
# Deployment - PPO 训练服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matformppo-training
  namespace: matformppo
  labels:
    app: matformppo
    component: training
spec:
  replicas: 1  # PPO 训练通常是单副本
  selector:
    matchLabels:
      app: matformppo
      component: training
  template:
    metadata:
      labels:
        app: matformppo
        component: training
    spec:
      containers:
      - name: training
        image: matformppo:latest  # 需替换为实际的镜像仓库地址
        imagePullPolicy: Always
        
        # 资源请求和限制
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"  # GPU 支持
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        
        # 环境变量
        env:
        - name: PIPELINE_TEST
          valueFrom:
            configMapKeyRef:
              name: matformppo-config
              key: PIPELINE_TEST
        - name: MP_API_KEY
          valueFrom:
            secretKeyRef:
              name: matformppo-secrets
              key: MP_API_KEY
        - name: BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: matformppo-config
              key: BATCH_SIZE
        - name: N_TOTAL
          valueFrom:
            configMapKeyRef:
              name: matformppo-config
              key: N_TOTAL
        
        # 持久化存储挂载
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: models-volume
          mountPath: /app/models
        - name: logs-volume
          mountPath: /app/logs
        
        # 启动命令
        command: ["python"]
        args: ["scripts/train_ppo.py", "--episodes", "100"]
        
        # 健康检查
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import os; exit(0 if os.path.exists('/app/models') else 1)"
          initialDelaySeconds: 30
          periodSeconds: 60
        
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import torch; exit(0)"
          initialDelaySeconds: 10
          periodSeconds: 30
      
      # 存储卷
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: matformppo-data-pvc
      - name: models-volume
        persistentVolumeClaim:
          claimName: matformppo-models-pvc
      - name: logs-volume
        emptyDir: {}  # 日志使用临时存储，通过日志聚合系统收集
      
      # 节点选择器（选择带 GPU 的节点）
      nodeSelector:
        accelerator: nvidia-gpu
      
      # 容忍度（允许在特定节点上调度）
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
---
# Deployment - 仪表盘服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matformppo-dashboard
  namespace: matformppo
  labels:
    app: matformppo
    component: dashboard
spec:
  replicas: 2  # 高可用性
  selector:
    matchLabels:
      app: matformppo
      component: dashboard
  template:
    metadata:
      labels:
        app: matformppo
        component: dashboard
    spec:
      containers:
      - name: dashboard
        image: matformppo:latest
        imagePullPolicy: Always
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1"
        
        ports:
        - containerPort: 8050
          name: http
        
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
          readOnly: true
        
        command: ["python"]
        args: ["dash_app/app.py"]
        
        # 健康检查
        livenessProbe:
          httpGet:
            path: /
            port: 8050
          initialDelaySeconds: 30
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /
            port: 8050
          initialDelaySeconds: 10
          periodSeconds: 10
      
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: matformppo-models-pvc
---
# Service - 仪表盘服务
apiVersion: v1
kind: Service
metadata:
  name: matformppo-dashboard-service
  namespace: matformppo
  labels:
    app: matformppo
    component: dashboard
spec:
  type: LoadBalancer  # 使用负载均衡器暴露服务
  selector:
    app: matformppo
    component: dashboard
  ports:
  - port: 80
    targetPort: 8050
    protocol: TCP
    name: http
  sessionAffinity: ClientIP  # 会话亲和性
---
# HorizontalPodAutoscaler - 仪表盘自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matformppo-dashboard-hpa
  namespace: matformppo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matformppo-dashboard
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5分钟稳定窗口
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
# Ingress - 入口配置（可选，用于域名访问）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matformppo-ingress
  namespace: matformppo
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - matformppo.example.com
    secretName: matformppo-tls
  rules:
  - host: matformppo.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: matformppo-dashboard-service
            port:
              number: 80
---
# ServiceMonitor - Prometheus 监控（如果使用 Prometheus Operator）
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: matformppo-monitor
  namespace: matformppo
  labels:
    app: matformppo
spec:
  selector:
    matchLabels:
      app: matformppo
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
